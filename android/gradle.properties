# -Xmx8G here previously crashed the Gradle daemon outright
# ("Native memory allocation (mmap) failed... insufficient memory for the
# Java Runtime Environment") on any machine that doesn't have well over
# 8GB of RAM free for this one process alone — the JVM was trying to
# grow its heap toward a ceiling the OS physically couldn't back. 3G is
# safe on an 8GB machine even with Android Studio and a browser also
# running; if you have more RAM to spare (16GB+ machine), override this
# higher in your own user-level ~/.gradle/gradle.properties instead of
# raising the committed default here, so this stays safe for whoever's
# building on more constrained hardware.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1536m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
