name: albmap
description: AlbMap Business Discovery App
publish_to: "none"
# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.3+7

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  google_sign_in: ^6.2.2
  flutter_facebook_auth: ^7.1.1

  # Navigation
  go_router: ^14.2.0

  # Maps & Location
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  location: ^6.0.2

  # Networking
  dio: ^5.4.3+1
  connectivity_plus: ^6.0.3
  pretty_dio_logger: ^1.3.1

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Firebase (push notifications)
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2

  # Functional/error handling
  dartz: ^0.10.1
  equatable: ^2.0.5
  collection: ^1.18.0
  uuid: ^4.4.0

  # Dependency injection
  get_it: ^7.7.0

  # UI utilities
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  intl: ^0.20.2
  url_launcher: ^6.3.0
  share_plus: ^10.1.4
  table_calendar: ^3.1.2
  flutter_rating_bar: ^4.0.1
  add_2_calendar: ^3.0.1
  easy_localization: ^3.0.7
  logger: ^2.3.0
  package_info_plus: ^8.0.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700

# Generates all platform launcher-icon sizes from one master image via
# `dart run flutter_launcher_icons`. Source lives in assets/icon/ (not
# in the `flutter.assets` list above — it's a build-time input, not
# something the running app needs to bundle). Re-run after replacing
# icon_master.png/icon_foreground.png to regenerate every size.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon_master.png"
  min_sdk_android: 23
  adaptive_icon_background: "#E31320"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: true